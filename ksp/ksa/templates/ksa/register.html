{% extends 'ksa/base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="auth">
    <form method="post" class="panel form" novalidate>
        {% csrf_token %}
        <h1 class="page-title">Регистрация</h1>
        {% for field in form %}
            <label class="field">
                <span class="field__label">{{ field.label }}</span>
                {{ field }}
                {% for error in field.errors %}<span class="field__error">{{ error }}</span>{% endfor %}
                {% if field.help_text and not field.errors %}<div class="field__help">{{ field.help_text|safe }}</div>{% endif %}
            </label>
        {% endfor %}
        <button type="submit" class="btn btn--block">Создать аккаунт</button>
        <p class="muted auth__switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </form>
</div>
{% endblock %}
