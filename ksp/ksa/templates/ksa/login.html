{% extends 'ksa/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="auth">
    <form method="post" class="panel form" novalidate>
        {% csrf_token %}
        <h1 class="page-title">Вход</h1>
        {% if error %}<div class="message message--error">{{ error }}</div>{% endif %}
        <label class="field">
            <span class="field__label">Имя пользователя</span>
            {{ form.username }}
        </label>
        <label class="field">
            <span class="field__label">Пароль</span>
            {{ form.password }}
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn--block">Войти</button>
        <p class="muted auth__switch">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </form>
</div>
{% endblock %}
